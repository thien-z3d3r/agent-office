# Agent Office - 8-Role Dev Office Configuration

version: 1
activeProvider: "antigravity"
activeRuntime: "jcode"
office:
  name: "Agent Office"
  host: "127.0.0.1"
  port: 4173
  targetRepo: "./sandbox-repo"
  worktreesDir: "./.worktrees"

providers:
  antigravity:
    authMode: "jcode-oauth"
    binary: "/home/skadi/.local/bin/jcode"
    jcodeProvider: "antigravity"
    # Uses local jcode CLI OAuth state; the server never reads or proxies raw OAuth tokens.
  claude:
    authMode: "api-key"
    envKey: "ANTHROPIC_API_KEY"
    jcodeProvider: "anthropic-api"
  openai_oauth:
    authMode: "jcode-oauth"
    binary: "/home/skadi/.local/bin/jcode"
    jcodeProvider: "openai"
  openai_api:
    authMode: "api-key"
    envKey: "OPENAI_API_KEY"
    jcodeProvider: "openai-api"
  kimi_code:
    authMode: "api-key"
    envKey: "KIMI_API_KEY"
    baseUrl: "https://api.kimi.com/coding/v1"
    jcodeProvider: "kimi"
  gemini:
    authMode: "api-key"
    envKey: "GEMINI_API_KEY"
    jcodeProvider: "gemini-api"

limits:
  reviewRounds: 3
  qaBounces: 2
  askAgentPerStage: 3
  maxTurnsPerStage: 25
  ticketUsd: 2.00
  dailyUsd: 15.00
  concurrency:
    total: 4

roles:
  - id: em
    title: "Engineering Manager"
    zone: "em_glass_office"
    tint: "#6366f1"
    accessory: "clipboard"
    tools: ["board.triage", "board.assign", "board.comment", "ask_agent", "ask_director"]
    allowCommands: []

  - id: pm
    title: "Product Manager"
    zone: "planning_pod_pm"
    tint: "#ec4899"
    accessory: "sticky_pad"
    tools: ["read", "grep", "write:docs/specs/**", "board.comment", "ask_agent", "ask_director"]
    allowCommands: []

  - id: tl
    title: "Tech Lead / Architect"
    zone: "planning_pod_tl"
    tint: "#8b5cf6"
    accessory: "blueprint_tube"
    tools: ["read", "grep", "write:docs/adr/**", "git.diff", "git.log", "board.breakdown", "board.propose_merge", "ask_agent", "ask_director"]
    allowCommands: ["git status", "git diff *", "git log *"]

  - id: fe
    title: "Frontend Engineer"
    zone: "dev_pod_fe"
    tint: "#06b6d4"
    accessory: "headphones"
    tools: ["read", "grep", "write", "apply_patch", "bash", "board.comment", "ask_agent"]
    allowCommands: ["git status", "git diff *", "git add *", "git commit *", "pnpm --filter @agent-office/web typecheck", "pnpm --filter @agent-office/web test *"]

  - id: be
    title: "Backend Engineer"
    zone: "dev_pod_be"
    tint: "#10b981"
    accessory: "coffee_mug"
    tools: ["read", "grep", "write", "apply_patch", "bash", "board.comment", "ask_agent"]
    allowCommands: ["git status", "git diff *", "git add *", "git commit *", "pnpm --filter @agent-office/server typecheck", "pnpm --filter @agent-office/server test *"]

  - id: qa
    title: "QA Engineer"
    zone: "qa_lab"
    tint: "#f59e0b"
    accessory: "visor"
    tools: ["read", "grep", "write:**/*.test.ts", "write:tests/**", "run_command", "board.comment", "board.report_bug"]
    allowCommands: ["pnpm test", "pnpm -r test", "pnpm vitest *", "pnpm playwright test *", "git status", "git diff *"]

  - id: reviewer
    title: "Code Reviewer / Security"
    zone: "review_desk"
    tint: "#ef4444"
    accessory: "magnifying_glass"
    tools: ["read", "grep", "git.diff", "git.log", "review.submit"]
    allowCommands: ["git diff *", "git log *", "git status"]

  - id: devops
    title: "DevOps / Release Engineer"
    zone: "server_rack_corner"
    tint: "#14b8a6"
    accessory: "hardhat"
    tools: ["read", "grep", "write:Dockerfile*", "write:.github/**", "write:scripts/**", "run_command", "board.comment"]
    allowCommands: ["pnpm -r build", "pnpm -r lint", "pnpm -r typecheck", "pnpm depcruise", "pnpm assets:check", "git status", "git log *"]
